name: vitest

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        id: vitest
        run: bun run test -- --reporter=verbose --reporter=junit --outputFile=junit.xml --reporter=github-actions

      - name: Typecheck app and desktop
        run: bun run typecheck

      - name: Check architectural boundaries
        run: bun run lint:architecture

      - name: Build production application
        run: bunx vite build

      - name: Verify generated routes are synchronized
        run: git diff --exit-code -- src/routeTree.gen.ts

      # Artifacts to be consumed by the Test Results workflow (vitest-results.yml)

      - name: Upload test artifacts
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: |
            junit.xml
          retention-days: 30

      - name: Upload Event File
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}
