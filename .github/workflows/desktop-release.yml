name: Desktop release

# Release events publish installers + update metadata. Signing is optional for this
# personal/community fork: if publisher credentials exist, Windows/macOS artifacts are
# signed and verified; otherwise the release proceeds unsigned with an explicit warning.
# Pull requests and manual dispatches always validate packaging unsigned.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - package.json
      - bun.lock
      - desktop/**
      - scripts/build-electron.mjs
      - scripts/build-binary.mjs
      - electron-builder.yml
      - electron-builder.unsigned.yml
      - electron-builder.release.yml
      - build/installer.nsh
      - tests/toolchain/desktop-signing-hardening.test.ts
      - .github/workflows/desktop-release.yml

jobs:
  dry-run:
    if: github.event_name != 'release'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop installers without publishing
        run: bun run electron:dist

  publish:
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify release tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Release tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Detect optional desktop signing
        id: signing
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          enabled=0

          case "$RUNNER_OS" in
            Windows)
              if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
                enabled=1
                echo "Windows signing credentials detected; signed release mode enabled."
              else
                echo "::warning::Windows signing credentials are not configured; publishing unsigned installer."
              fi
              ;;
            macOS)
              if [ -n "$MAC_CSC_LINK" ] &&
                 [ -n "$MAC_CSC_KEY_PASSWORD" ] &&
                 [ -n "$APPLE_ID" ] &&
                 [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] &&
                 [ -n "$APPLE_TEAM_ID" ]; then
                enabled=1
                echo "macOS signing/notarization credentials detected; signed release mode enabled."
              else
                echo "::warning::macOS signing/notarization credentials are not configured; publishing unsigned artifacts."
              fi
              ;;
            Linux)
              echo "Linux release does not require desktop publisher signing."
              ;;
          esac

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload desktop artifacts
        run: bun run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERRATA_ENABLE_DESKTOP_SIGNING: ${{ steps.signing.outputs.enabled }}

          # Optional Windows signing credentials.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

          # Optional macOS signing/notarization credentials.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify Windows Authenticode signature when signing is enabled
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == '1'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'Errata-*-windows-x64.exe' |
            Where-Object { $_.Name -notlike '*.__uninstaller.exe' } |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Windows installer was not produced.'
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer Authenticode signature is not valid: $($signature.Status)"
          }
          if (-not $signature.SignerCertificate) {
            throw 'Windows installer has no signer certificate.'
          }
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

      - name: Verify macOS signature and notarization when signing is enabled
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == '1'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find release -type d -name 'Errata.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Errata.app was not produced."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --verbose --type exec "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Record unsigned Windows release mode
        if: runner.os == 'Windows' && steps.signing.outputs.enabled != '1'
        run: echo "::notice::Windows installer was intentionally published unsigned for personal/community distribution."

      - name: Record unsigned macOS release mode
        if: runner.os == 'macOS' && steps.signing.outputs.enabled != '1'
        run: echo "::notice::macOS artifacts were intentionally published unsigned for personal/community distribution."
