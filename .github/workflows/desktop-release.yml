name: Desktop release

# Builds the Electron desktop app for Windows, macOS, and Linux and uploads the installers +
# update metadata (latest*.yml) to the GitHub Release that triggered the run. electron-updater
# reads those to deliver auto-updates. Fires on the same event as release-binary.yml, so
# publishing a release builds both the standalone binaries and the desktop installers.
#
# The release tag must match the package.json version (electron-builder targets v<version>).
# macOS auto-update only works once the build is signed + notarized: provide the APPLE_* /
# CSC_* secrets below. Without them the macOS build is produced unsigned and auto-update on
# macOS stays inert.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Release tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload desktop installers
        if: github.event_name == 'release'
        run: bun run electron:release
        env:
          # Used by electron-builder to upload assets to the triggering GitHub Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code signing unless a certificate is configured. Without this, the
          # mac runner attempts ad-hoc signing with no cert and fails ("not a file"). When
          # CSC_LINK is set, signing + notarization run via the secrets below.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          # macOS code signing + notarization (only consumed on the macOS runner).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build desktop installers without publishing
        if: github.event_name == 'workflow_dispatch'
        run: bun run electron:dist
