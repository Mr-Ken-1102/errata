name: Desktop release

# Release events publish installers + update metadata. Pull requests and manual dispatches run
# the same cross-platform installer build without publishing, so release packaging can be
# validated before a tag/release exists.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - package.json
      - bun.lock
      - desktop/**
      - scripts/build-electron.mjs
      - scripts/build-binary.mjs
      - electron-builder.yml
      - build/installer.nsh
      - .github/workflows/desktop-release.yml

jobs:
  dry-run:
    if: github.event_name != 'release'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop installers without publishing
        run: bun run electron:dist

  publish:
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify release tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Release tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload desktop installers
        run: bun run electron:release
        env:
          # Used by electron-builder to upload assets to the triggering GitHub Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code signing unless a certificate is configured. Without this, the
          # mac runner attempts ad-hoc signing with no cert and fails ("not a file"). When
          # CSC_LINK is set, signing + notarization run via the secrets below.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          # macOS code signing + notarization (only consumed on the macOS runner).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
