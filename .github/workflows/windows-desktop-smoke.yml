name: Windows desktop smoke

on:
  pull_request:
    branches: [main, master]
    paths:
      - start.bat
      - desktop/**
      - scripts/electron-dev.mjs
      - scripts/build-electron.mjs
      - scripts/build-binary.mjs
      - electron-builder.yml
      - package.json
      - .github/workflows/windows-desktop-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate start.bat
        shell: cmd
        run: start.bat check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck desktop
        run: bunx tsc -p desktop/tsconfig.json --noEmit

      - name: Package unpacked Windows desktop
        run: bun run electron:pack

      - name: Verify packaged server sidecar
        shell: pwsh
        run: |
          $app = 'release\win-unpacked\Errata.exe'
          $sidecar = 'release\win-unpacked\resources\server\errata.exe'
          $public = 'release\win-unpacked\resources\server\public'
          if (-not (Test-Path $app)) { throw "Packaged Electron executable missing: $app" }
          if (-not (Test-Path $sidecar)) { throw "Bundled Errata sidecar missing: $sidecar" }
          if (-not (Test-Path $public -PathType Container)) { throw "Bundled public assets missing: $public" }
