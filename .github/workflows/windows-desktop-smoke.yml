name: Windows desktop smoke

on:
  pull_request:
    branches: [main, master]
    paths:
      - start.bat
      - desktop/**
      - scripts/electron-dev.mjs
      - scripts/build-electron.mjs
      - scripts/build-binary.mjs
      - electron-builder.yml
      - build/installer.nsh
      - package.json
      - .github/workflows/windows-desktop-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate start.bat
        shell: cmd
        run: start.bat check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck desktop
        run: bunx tsc -p desktop/tsconfig.json --noEmit

      - name: Package unpacked Windows desktop
        run: bun run electron:pack

      - name: Verify packaged server sidecar
        shell: pwsh
        run: |
          $app = 'release\win-unpacked\Errata.exe'
          $sidecar = 'release\win-unpacked\resources\server\errata.exe'
          $public = 'release\win-unpacked\resources\server\public'
          if (-not (Test-Path $app)) { throw "Packaged Electron executable missing: $app" }
          if (-not (Test-Path $sidecar)) { throw "Bundled Errata sidecar missing: $sidecar" }
          if (-not (Test-Path $public -PathType Container)) { throw "Bundled public assets missing: $public" }

      - name: Boot bundled server sidecar
        shell: pwsh
        run: |
          $sidecar = (Resolve-Path 'release\win-unpacked\resources\server\errata.exe').Path
          $serverDir = Split-Path $sidecar
          $dataDir = Join-Path $env:RUNNER_TEMP 'errata-sidecar-smoke-data'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ($listener.LocalEndpoint).Port
          $listener.Stop()

          $env:PORT = [string]$port
          $env:NITRO_PORT = [string]$port
          $env:HOST = '127.0.0.1'
          $env:NITRO_HOST = '127.0.0.1'
          $env:DATA_DIR = $dataDir

          $proc = Start-Process -FilePath $sidecar -WorkingDirectory $serverDir -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              Start-Sleep -Milliseconds 250
              if ($proc.HasExited) {
                throw "Bundled sidecar exited before becoming healthy (code $($proc.ExitCode))."
              }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:$port/api/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {
                # Server is still starting.
              }
            }
            if (-not $healthy) {
              throw "Bundled sidecar did not become healthy on port $port."
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              $proc.WaitForExit()
            }
          }
